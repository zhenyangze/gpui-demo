[workspace]
resolver = "2"
members = [
    "crates/gpui-kit",
    "crates/demo-gallery",
    "crates/demo-flowmail",
    "crates/demo-agentconsole",
    "crates/demo-game2048",
    "crates/demo-devtoolbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 本机 Xcode 26 缺少 Metal Toolchain 组件,启用 runtime_shaders 走运行时编译(系统 Metal 框架)
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
anyhow = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"

[profile.release]
opt-level = 2
lto = false
